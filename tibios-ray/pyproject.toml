[project]
name = "tibios-ray"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "ray>=2.56.1",
]

[project.scripts]
tibios-ray = "tibios_ray:main"

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.34,<0.4"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/tibios_ray/transport/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/tibios_ray/transport/_generated"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
reportUnnecessaryTypeIgnoreComment = true
