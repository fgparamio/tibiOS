[project]
name = "tibios-ray"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "ray>=2.56.1",
]

[project.scripts]
tibios-ray = "tibios_ray:main"

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.34,<0.4"]
# vllm pulls in a GB-scale, CUDA/torch-pinned wheel — heavier than
# llamacpp's extra above (design.md "Risks"). The unit test tier must
# never require this extra to be installed (`engines/vllm.py`'s lazy
# `importlib` seam, design decision VL8/LC11).
vllm = ["vllm>=0.9.0,<0.10"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/tibios_ray/transport/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/tibios_ray/transport/_generated"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportUnnecessaryTypeIgnoreComment = true
