[project]
name = "tibios-ray"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    "ray>=2.56.1",
]

[project.scripts]
tibios-ray = "tibios_ray:main"

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.34,<0.4"]
# vllm pulls in a GB-scale, CUDA/torch-pinned wheel — heavier than
# llamacpp's extra above (design.md "Risks"). The unit test tier must
# never require this extra to be installed (`engines/vllm.py`'s lazy
# `importlib` seam, design decision VL8/LC11).
# `python_version < '3.14'` marker: vllm pins torch==2.7.0, which
# ships no cp314 wheel, and `requires-python = ">=3.14"` is project-wide
# — without this marker, `uv lock`/`uv sync`/`uv run` fail to resolve
# for *everyone*, including the SDK-free unit tier that never touches
# vllm at all. Revisit (drop the marker) once upstream torch/vllm ship
# a cp314 build; a real GPU install today targets a <3.14 interpreter
# for this extra specifically.
vllm = ["vllm>=0.9.0,<0.10; python_version < '3.14'"]
# Two artifacts, one debt (design.md OR10): `model_path` and
# `tokenizer_path` ship as separate construction arguments with nothing
# here verifying they are a matched pair — discharged by a future
# change that resolves `ResolvedModelRef` into an atomic artifact
# bundle, not by this extra.
onnx = ["onnxruntime>=1.20.0", "transformers>=4.46.0"]
# `tensorrt-llm` ships no repo-wide index entry (D31/D32): PyPI carries
# only a source distribution (no wheel), and the real prebuilt wheels
# live on NVIDIA's own index or inside an NGC container image — install
# with `uv add tibios-ray[tensorrt] --index <NVIDIA's wheel index>`, or
# use a prebuilt NGC container that already provides it (see the
# Operational Model; `default_engine_factory`'s `ModuleNotFoundError`
# repeats this at the point of failure).
# `python_version < '3.14'` marker (D30), same shape as the `vllm` extra
# above: verified against PyPI (Aug 2026) — `tensorrt-llm`'s
# `requires-python` is `>=3.10,<4` but its classifiers tag only
# 3.10/3.12, no confirmed cp314 wheel — and `requires-python = ">=3.14"`
# is project-wide, so without this marker `uv lock`/`uv sync`/`uv run`
# fail to resolve for *everyone*, including the SDK-free unit tier that
# never imports tensorrt_llm at all (LC11/D39's seam). Revisit (drop the
# marker) once upstream ships a cp314 build.
tensorrt = ["tensorrt-llm>=1.2.1,<1.3; python_version < '3.14'"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/tibios_ray/transport/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/tibios_ray/transport/_generated"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
reportUnnecessaryTypeIgnoreComment = true
